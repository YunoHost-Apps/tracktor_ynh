#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "tracktor"
name = "Tracktor"

description.en = "Vehicle Tracking Management System"

version = "1.4.1~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "MIT"
demo = "https://tracktor.bytedge.in"
code = "https://github.com/javedh-dev/tracktor"

[integration]
yunohost = '>= 12.1.39'
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false
ldap = false
sso = false
disk = "1.5G"
ram.build = "4G"
ram.runtime = "250M"

[install]

	[install.domain]
	type = "domain"

	# waiting for https://github.com/javedh-dev/tracktor/issues/154
	# [install.path]
	# type = "path"
	# default = "/tracktor"

	[install.init_main_permission]
	type = "group"
	default = "visitors"

[resources]

	[resources.sources]

		[resources.sources.main]
		url = "https://github.com/javedh-dev/tracktor/archive/refs/tags/1.4.1.tar.gz"
		sha256 = "9c7c2b94c6c0171cb2ca03278844706d5e9ffc0a42087022190c99cbc2422dc3"

		autoupdate.strategy = "latest_github_release"

	[resources.system_user]

	[resources.install_dir]

	[resources.data_dir]

	[resources.permissions]
	main.url = "/"
	api.url = "/api"
	api.allowed = "visitors"
	api.auth_header = false
	api.show_tile = false
	api.protected = true

	[resources.ports]

	[resources.nodejs]
	version = "24.14.1"
